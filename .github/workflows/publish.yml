name: Publish to PyPI

# Bir sürüm etiketi push edildiğinde paketi derleyip PyPI'ye yayımlar:
#   v2.0.0 gibi           -> `dayanak` (depo kökü)
#   emsal-mcp-v1.2.0 gibi -> eski ad için uyumluluk paketi (compat/emsal-mcp)
# Token kullanılmaz: PyPI'de her iki proje için bu depo, bu iş akışı ve "pypi"
# ortamıyla bir "trusted publisher" tanımlı olmalıdır.

on:
  push:
    tags: ["v*", "emsal-mcp-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick the package and check that the tag matches its version
        run: |
          case "${GITHUB_REF_NAME}" in
            emsal-mcp-v*) dir=compat/emsal-mcp; prefix=emsal-mcp-v ;;
            *)            dir=.;                prefix=v ;;
          esac
          version=$(python -c "import tomllib;print(tomllib.load(open('${dir}/pyproject.toml','rb'))['project']['version'])")
          test "${prefix}${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != ${prefix}${version}"; exit 1; }
          echo "PKG_DIR=${dir}" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build -o dist "${PKG_DIR}"
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
